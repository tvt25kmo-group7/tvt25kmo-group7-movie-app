name: Deploy Full Application to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            # Siirrytaan projektikansioon
            mkdir -p ~/movie-app
            cd ~/movie-app

            # Hae uusin koodi GitHubista palvelimelle
            if [ ! -d ".git" ]; then
              git clone https://github.com/${{ github.repository }}.git .
            else
              git pull origin main
            fi

            # Pysayta vanhat versiot ja rakenna frontend seka backend uudelleen
            docker compose down
            docker compose up -d --build
