name: Deploy Full Application to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            if [ "${{ github.repository }}" != "tvt25kmo-group7/tvt25kmo-group7-movie-app" ]; then
              echo "Skipping deployment: unexpected repository"
              exit 0
            fi

            if [ "${{ github.ref_name }}" != "main" ]; then
              echo "Skipping deployment: branch is not main"
              exit 0
            fi

            BRANCH="${{ github.ref_name }}"

            # Siirrytaan projektikansioon
            mkdir -p ~/movie-app
            cd ~/movie-app

            # Hae uusin koodi GitHubista palvelimelle
            if [ ! -d ".git" ]; then
              rm -rf ./* ./.git 2>/dev/null || true
              git clone --branch "$BRANCH" --single-branch https://github.com/${{ github.repository }}.git .
            else
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            # Pysayta vanhat versiot ja rakenna frontend seka backend uudelleen
            if ! docker compose version >/dev/null 2>&1; then
              echo "Docker Compose plugin is not available on the server"
              exit 1
            fi

            docker compose down || true
            docker compose up -d --build
            docker compose ps
            docker compose logs movie-backend movie-frontend movie-db || true
