name: Deploy Full Application to Server

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Deploy to Ubuntu Server via SSH
        uses: appleboy/ssh-action@v1.0.3
        with:
          host: ${{ secrets.SERVER_HOST }}
          username: ubuntu
          key: ${{ secrets.SSH_PRIVATE_KEY }}
          script: |
            set -e

            if [ "${{ github.repository }}" != "tvt25kmo-group7/tvt25kmo-group7-movie-app" ]; then
              echo "Skipping deployment: unexpected repository"
              exit 0
            fi

            BRANCH="main"

            # Siirrytaan projektikansioon
            mkdir -p ~/movie-app
            cd ~/movie-app

            # Hae uusin koodi GitHubista palvelimelle
            if [ ! -d ".git" ]; then
              rm -rf ./* ./.git 2>/dev/null || true
              git clone --branch "$BRANCH" --single-branch https://github.com/${{ github.repository }}.git .
            else
              git fetch origin "$BRANCH"
              git checkout "$BRANCH"
              git reset --hard "origin/$BRANCH"
            fi

            # Pysayta vanhat versiot ja rakenna frontend seka backend uudelleen
            docker rm -f movie-backend movie-frontend movie-db 2>/dev/null || true
            docker build -t movie-backend ./Backend
            docker run -d --name movie-backend -p 5000:5000 movie-backend
            docker build -t movie-frontend ./Frontend
            docker run -d --name movie-frontend -p 5173:5173 movie-frontend
            docker run -d --name movie-db -e POSTGRES_USER=movie_user -e POSTGRES_PASSWORD=movie_secure_password -e POSTGRES_DB=movie_database -p 5432:5432 postgres:16
            docker ps
